<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock-Paper-Scissors</title>
    <link rel="stylesheet" href="styles.css">
    <script src="index.js" defer></script>
</head>
<body>

    <div class="wrapper">
        <h1>Rock-Paper-Scissors</h1>

        

        <div id="choices">
            <button id="rock"><img src ="rock.jpg" class = "button-icon" alt = "rock">Rock</button>
            <button id = "paper"><img src ="paper.jpg" class = "button-icon" alt = "paper">Paper</button>
            <button id = "scissors"><img src ="scissors.webp" class = "button-icon" alt = "scissors">Scissors</button>
        </div>

        <h3>Choose!</h3>

        <div id="play-choice">PLAYER: </div>
        <div id="computer-choice">COMPUTER: </div>
        <div id="resultDisplay">RESULT</div>

        <div id = "scores">
            <div id = "player">
                <h2>Player Score:</h2>
                <p id = "player-score"></p>
            </div>

            <div id = "computer">
                <h2>Computer Score:</h2>
                <p id = "computer-score"></p>
            </div>

        </div>

    </div>
    


</body>
</html>
